# Business metadata rules (C-103) — placeholders. Each rule matches the document source
# (path, blob URI, SharePoint/Confluence URI) with a case-insensitive regex; matching rules
# set fields (later rules override earlier ones) and add tags.
# Fields: department, region, doc_type (one of DOC_TYPES), any other key -> metadata extra.

rules:
  - match: "/policies?/"
    doc_type: policy
  - match: "/procedures?/|/sop/"
    doc_type: procedure
  - match: "/faq/|faq"
    doc_type: faq
  - match: "/hr/|sites/HR"
    department: Human Resources
    tags: [hr]
  - match: "/finance/|sites/Finance"
    department: Finance
    tags: [finance]
  # - match: "/regions/africa/"
  #   region: AFR
