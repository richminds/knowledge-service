[project]
name = "knowledge-service"
version = "1.0.0"
description = "Generic RAG service — document ingestion + hybrid retrieval + cited generation over MongoDB Atlas. HTTP service extracted from a monolith's shared/rag, calling an LLM Gateway for every model invocation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "motor>=3.3",
    "langgraph>=0.1,<1.0",
    "langchain-core>=0.2,<1.0",
    "langchain-community>=0.2,<1.0",
    "langchain-text-splitters>=0.2,<1.0",
    "rank-bm25>=0.2",
    "numpy",
    "scikit-learn",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]
ocr = ["pdf2image>=1.17", "pytesseract>=0.3"]
rerank = ["sentence-transformers>=3.0"]
graph-neo4j = ["neo4j>=5.14"]
eval = ["ragas", "deepeval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag", "sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
