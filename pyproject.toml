[project]
name = "oissa-rag-agent"
version = "0.1.0"
description = "RAG-based knowledge agent service (ingestion + retrieval) built with FastAPI"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.5.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25.0",
    "redis>=5.0.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pymongo>=4.13",
    "networkx>=3.2",
    "langgraph>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Vercel: the app is src/app/main.py:app, outside Vercel's default locations.
# index.py puts src/ on the path and re-exports it.
[tool.vercel]
entrypoint = "index:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit security checks
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S104", # binding 0.0.0.0 is intended inside the container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S324"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/rag/vectorstore/mongo_store.py",  # exercised against a live Atlas cluster only
    "src/app/rag/graph/mongo_store.py",
]
