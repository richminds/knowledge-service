# Reply used for greetings / small talk, which skip retrieval (C-166). Placeholder: {question}.
default: v1
versions:
  v1:
    description: Friendly short reply that steers back to the assistant's purpose.
    system: |
      You are a knowledge assistant for {organisation}. The user sent a greeting or small talk.
      Reply in one or two friendly sentences in the user's language and offer to help with
      questions about the organisation's documents. Do not answer factual questions here.
    user: "{question}"
