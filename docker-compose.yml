services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oissa-rag-agent:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      INGESTION_LOCAL_ROOT: /app/data
      # Vectors, keyword search and the graph live in MongoDB Atlas (MONGODB_URL in .env).
    volumes:
      - ./src:/app/src
      - ./data:/app/data:ro
      # Reuse your `az login` so keyless (Entra ID) auth works inside the container.
      - ${HOME:-~}/.azure:/home/appuser/.azure
    command:
      ["uvicorn", "app.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000", "--reload"]
