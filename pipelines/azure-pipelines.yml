# CI/CD for the RAG knowledge agent.
#
#   Build ─► DeployQA (develop, main) + QualityGate (golden set, C-213)
#         ─► DeployProd (main only, manual approval; to the "staging" slot, smoke-tested,
#            then swapped into production, C-234)
#
# The same image (tagged with the build id) is promoted from QA to Prod; it is never rebuilt.
# One-time Azure DevOps setup (see README "CI/CD"):
#   - Service connections named in pipelines/variables/*.yml
#   - Environments "qa" and "prod"; add an Approvals check on "prod"

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - "*.md"
      - "RAG-*"

pr:
  branches:
    include:
      - main
      - develop

variables:
  - template: variables/common.yml
  - name: imageTag
    value: "$(Build.BuildId)"

stages:
  # ---------------------------------------------------------------------------
  # CI: lint, type-check, test, validate IaC, build (and on non-PR runs push) the image
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: "Build, test & publish image"
    jobs:
      - job: BuildAndTest
        displayName: "Lint, test, build image"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - template: templates/build-and-test.yml
            parameters:
              pythonVersion: ${{ variables.pythonVersion }}
              pushImage: ${{ ne(variables['Build.Reason'], 'PullRequest') }}
              imageRepository: ${{ variables.imageRepository }}
              imageTag: $(imageTag)
              containerRegistryServiceConnection: ${{ variables.containerRegistryServiceConnection }}

  # ---------------------------------------------------------------------------
  # CD: QA — auto-deploy from develop and main
  # ---------------------------------------------------------------------------
  - stage: DeployQA
    displayName: "Deploy to QA"
    dependsOn: Build
    condition: >-
      and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'),
      in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/main'))
    variables:
      - template: variables/qa.yml
    jobs:
      - deployment: DeployQA
        displayName: "Deploy infra + container to QA"
        environment: "qa"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy.yml
                  parameters:
                    environmentName: qa
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    resourceGroup: ${{ variables.resourceGroup }}
                    location: ${{ variables.location }}
                    bicepParamFile: ${{ variables.bicepParamFile }}
                    containerImage: "$(containerRegistry)/$(imageRepository):$(imageTag)"

      # Golden-set evaluation against QA; blocks promotion on quality regressions.
      - job: QualityGate
        displayName: "Quality gate (golden set)"
        dependsOn: DeployQA
        timeoutInMinutes: 60
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - template: templates/eval-gate.yml
            parameters:
              azureSubscription: ${{ variables.azureServiceConnection }}
              resourceGroup: ${{ variables.resourceGroup }}
              pythonVersion: ${{ variables.pythonVersion }}

  # ---------------------------------------------------------------------------
  # CD: Production — main only, gated by the "prod" environment's approval check
  # (Pipelines > Environments > prod > Approvals and checks)
  # ---------------------------------------------------------------------------
  - stage: DeployProd
    displayName: "Deploy to Production"
    dependsOn: DeployQA
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - template: variables/prod.yml
    jobs:
      - deployment: DeployProd
        displayName: "Deploy infra + container to Production"
        environment: "prod"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/deploy.yml
                  parameters:
                    environmentName: prod
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    resourceGroup: ${{ variables.resourceGroup }}
                    location: ${{ variables.location }}
                    bicepParamFile: ${{ variables.bicepParamFile }}
                    containerImage: "$(containerRegistry)/$(imageRepository):$(imageTag)"
                    slot: staging
